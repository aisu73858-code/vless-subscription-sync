name: Sync VLESS subscription to Bitbucket

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vless-subscription
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate upstream
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 30 \
            --output vless_universal.txt \
            'https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt'
          count=$(grep -c '^vless://' vless_universal.txt || true)
          if [ "$count" -lt 20 ]; then
            echo "Upstream contains only $count VLESS entries; refusing to publish"
            exit 1
          fi

      - name: Update Bitbucket mirror
        shell: bash
        env:
          BB_TOKEN: ${{ secrets.BITBUCKET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BB_TOKEN"
          curl --fail --location --retry 3 --max-time 30 \
            --output current.txt \
            'https://bitbucket.org/casedas/zieng2-wl-mirror/raw/main/vless_universal.txt'
          if cmp -s vless_universal.txt current.txt; then
            echo 'Mirror already current'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $BB_TOKEN" \
            --form 'vless_universal.txt=@vless_universal.txt' \
            --form 'branch=main' \
            --form 'message=Sync upstream subscription [skip ci]' \
            'https://api.bitbucket.org/2.0/repositories/casedas/zieng2-wl-mirror/src' \
            --output response.json
          echo 'Bitbucket mirror updated'

      - name: Download and validate mobile CIDR subscription
        id: mobile_download
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 30 \
            --output mobile-cidr.txt \
            'https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt'
          count=$(grep -Ec '^[A-Za-z][A-Za-z0-9+.-]*://' mobile-cidr.txt || true)
          if [ "$count" -lt 10 ]; then
            echo "Mobile CIDR subscription contains only $count proxy entries; refusing to publish"
            exit 1
          fi

      - name: Update mobile CIDR mirror
        if: always() && steps.mobile_download.outcome == 'success'
        shell: bash
        env:
          BB_TOKEN: ${{ secrets.BITBUCKET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BB_TOKEN"
          status=$(curl --silent --show-error --location --retry 3 --max-time 30 \
            --output current-mobile.txt --write-out '%{http_code}' \
            'https://bitbucket.org/casedas/zieng2-wl-mirror/raw/main/Vless-Reality-White-Lists-Rus-Mobile.txt')
          if [ "$status" = 200 ] && cmp -s mobile-cidr.txt current-mobile.txt; then
            echo 'Mobile CIDR mirror already current'
            exit 0
          fi
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then
            echo "Bitbucket returned HTTP $status for mobile CIDR mirror"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $BB_TOKEN" \
            --form 'Vless-Reality-White-Lists-Rus-Mobile.txt=@mobile-cidr.txt' \
            --form 'branch=main' \
            --form 'message=Sync mobile CIDR subscription [skip ci]' \
            'https://api.bitbucket.org/2.0/repositories/casedas/zieng2-wl-mirror/src' \
            --output response-mobile.json
          echo 'Mobile CIDR mirror updated'

      - name: Check out schedule repository
        if: always()
        uses: actions/checkout@v6.1.0

      - name: Keep hourly schedule active
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          last_commit=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          if [[ -f .github/last-activity.txt ]] && (( now - last_commit < 30 * 24 * 3600 )); then
            echo 'GitHub repository has recent activity'
            exit 0
          fi
          mkdir -p .github
          date -u +%FT%TZ > .github/last-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity.txt
          git commit -m 'Keep hourly subscription schedule active'
          git push origin HEAD:main
